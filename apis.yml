name: We > Ultrarich
description: >-
  A free, non-commercial tool and public API that visualize extreme wealth inequality by comparing any wealth to
  ultrarich/billionaire/trillionaire wealth through four lenses: Duration Of Daily Spend, Height Of Stacked Money,
  Number Of Items Paid For, and Growth Of Compound Interest. All comparisons are deterministic arithmetic returning
  ready-to-quote figures, sentences, and them-vs-you ratios; no user data is collected. The surface is agent-native:
  a no-auth OpenAPI 3.0.4 REST API, a hosted Streamable-HTTP MCP server exposing the same five computations as tools,
  llms.txt and llms-full.txt, a published agent prompt, an APIs.json 0.21 index, and the Spectral ruleset the spec is
  linted against. Published by Blonde Rocket Scientist LLC; results are licensed CC BY 4.0 with a required attribution
  string.
